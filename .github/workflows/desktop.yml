#         with:
#           name: NeoWave-Windows-Portable
#           path: neowave_*_windows-*-portable.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      # download-artifact `pattern` splits on newlines, not commas, so each
      # artifact is fetched by exact name: a missing one fails loudly instead
      # of publishing an empty release.
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: NeoWave-Windows-Installer
          path: dist

      # DISABLED: Windows portable zip. Uncomment together with its build and upload steps.
#       - name: Download Windows portable
#         uses: actions/download-artifact@v4
#         with:
#           name: NeoWave-Windows-Portable
#           path: dist

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: NeoWave-Linux-Packages
          path: dist

      # DISABLED: Linux AppImage. Uncomment together with the AppImage build and upload steps.
#       - name: Download Linux AppImage
#         uses: actions/download-artifact@v4
#         with:
#           name: NeoWave-Linux-AppImage
#           path: dist

      - name: List release files
        run: find dist -type f

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
