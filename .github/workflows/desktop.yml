      # Ubuntu 22.04 ships mpv 0.34 (libmpv.so.1), which no modern distro has
      # (24.04+, Fedora, Arch ship only .so.2), so the loader would die before
      # main(). Retarget the media_kit plugin to .so.2; it only uses render/event
      # APIs present in both. Fails the job if .so.1 survives.
      - name: Normalize libmpv linkage
        run: |
          BUNDLE="build/linux/x64/release/bundle/lib"
          for f in "$BUNDLE"/libmedia_kit_video_plugin.so; do
            if objdump -p "$f" | grep -q "NEEDED.*libmpv.so.1"; then
              echo "Retargeting $f: libmpv.so.1 -> libmpv.so.2"
              patchelf --replace-needed libmpv.so.1 libmpv.so.2 "$f"
            fi
          done
          echo "--- NEEDED libmpv after normalize:"
          objdump -p "$BUNDLE"/libmedia_kit_video_plugin.so | grep "NEEDED.*libmpv"
          if objdump -p "$BUNDLE"/libmedia_kit_video_plugin.so | grep -q "NEEDED.*libmpv.so.1"; then
            echo "::error::libmpv.so.1 linkage survived normalization"
            exit 1
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoWave-Desktop-Linux
          path: build/linux/x64/release/bundle/

      # System packages are release-only (v* tags): PR/push builds
      # stop at the raw bundle above.
      - name: Setup Go (nFPM)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build deb/rpm packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "Packaging version $VERSION"
          ~/go/bin/nfpm package --config linux/packaging/nfpm.yaml --packager deb --target ./neowave_${VERSION}_amd64.deb
          ~/go/bin/nfpm package --config linux/packaging/nfpm.yaml --packager rpm --target ./neowave_${VERSION}_x86_64.rpm
          ls -la neowave_${VERSION}_amd64.deb neowave_${VERSION}_x86_64.rpm

      - name: Upload Linux Packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: NeoWave-Linux-Packages
          path: |
            neowave_*_amd64.deb
            neowave_*_x86_64.rpm

      # DISABLED: Linux AppImage upload (see the AppImage build step above).
#       - name: Upload Linux AppImage
#         if: startsWith(github.ref, 'refs/tags/v')
#         uses: actions/upload-artifact@v4
#         with:
#           name: NeoWave-Linux-AppImage
#           path: neowave_*_x86_64.AppImage

  build-windows:
    name: Build Windows Bundle
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoWave-Desktop-Windows
          path: build\windows\x64\runner\Release\

      # The single-file installer is release-only (v* tags): PR/push
      # builds stop at the raw Release folder above.
      - name: Build Inno Setup installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $verNum = ($ver -replace '[^0-9.].*$', '')
          if (-not $verNum) { $verNum = '1.0.0.0' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$ver" "/DMyAppVersionNum=$verNum" windows\installer.iss
          Get-ChildItem build\windows\installer\

      - name: Upload Windows Installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: NeoWave-Windows-Installer
          path: build\windows\installer\neowave_*.exe

      # DISABLED: Windows portable zip (build + upload). To re-enable, remove the leading "# " and the matching release download step.
#       # Portable zip is release-only (v* tags): the raw Release folder
#       # above zipped as-is (neowave.exe + bundled DLLs/data),
#       # no install step — run in place.
