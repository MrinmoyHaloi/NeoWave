name: Build and Release Desktop Apps

on:
  push:
    # branches:
    #   - main
    tags:
      - "v*"
    paths-ignore:
      - '**.md'
      - '**.yml'
  pull_request:
    # branches:
    #   - main
    paths-ignore:
      - '**.md'
      - '**.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config patchelf binutils \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev libasound2-dev libmpv-dev \
            libkeybinder-3.0-dev libwebkit2gtk-4.1-dev glib-networking

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release

